# Docker Environment Configuration for Mirror Product Service
spring.application.name=mirror-product-service
server.port=8082

# Database Configuration - Using AWS Secrets Manager
datasource.use-secrets-manager=true
rds.secret.name=${RDS_SECRET_NAME}
rds.secret.region=${AWS_REGION}

# Fallback Database Configuration (only used if secrets manager is disabled)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# JWT Configuration - Using AWS Secrets Manager
jwt.secret.use-secrets-manager=${JWT_USE_SECRETS_MANAGER:true}
jwt.secret.name=${JWT_SECRET_NAME}
jwt.secret.region=${JWT_SECRET_REGION}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400}

# Security Configuration
security.max-failed-attempts=${MAX_FAILED_ATTEMPTS:5}
security.account-lock-duration=${ACCOUNT_LOCK_DURATION:300}

# Rate Limiting Configuration
rate.limit.enabled=${RATE_LIMIT_ENABLED:false}

# AWS S3 Configuration
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.region.static=${AWS_REGION:ap-southeast-1}
cloud.aws.stack.auto=false

# CORS Configuration - Allow dashboard and services
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://dashboard:3000,http://localhost:8082,http://product-service:8082}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Logging Configuration - Docker optimized
logging.level.com.mirror.product=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.web=INFO
logging.level.root=INFO

# Server Configuration
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true

# Spring Security
spring.security.headers.frame=deny
spring.security.headers.content-type=nosniff
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Docker-specific optimizations
server.tomcat.connection-timeout=20000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10