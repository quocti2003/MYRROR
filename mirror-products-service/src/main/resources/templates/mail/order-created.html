<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Order Created</title>
</head>
<body>
<p>Hi <span th:text="${customerName}">Customer</span>,</p>
<p>Your order <strong th:text="${orderNumber}">ORDER-12345</strong> was created on <span th:text="${createdAt}">today</span>.</p>
<p>We will keep you posted as the status changes.</p>
</body>
</html>
