<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Order Status Changed</title>
</head>
<body>
<p>Hi <span th:text="${customerName}">Customer</span>,</p>
<p>Your order <strong th:text="${orderNumber}">ORDER-12345</strong> is now <span th:text="${status}">UPDATED</span>.</p>
<p th:if="${notes}">Notes: <span th:text="${notes}">Additional information</span></p>
</body>
</html>
