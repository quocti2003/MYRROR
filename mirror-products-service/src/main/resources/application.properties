# Application Configuration
spring.application.name=mirror-product-service
server.port=8082
server.address=0.0.0.0

# Database Configuration
# AWS Secrets Manager Configuration - ENABLED
datasource.use-secrets-manager=${USE_SECRETS_MANAGER:true}
rds.secret.name=${RDS_SECRET_NAME:rds!db-3c41e561-738d-4ff2-8e5f-ed6649af51b1}
rds.secret.region=${AWS_REGION:ap-southeast-1}
test.rds.connection=${TEST_RDS_CONNECTION:false}

# LOCAL DB (Used when datasource.use-secrets-manager=false)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Driver configuration (still needed for Secrets Manager)
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# JWT Configuration - Using AWS Secrets Manager
jwt.secret.use-secrets-manager=${JWT_USE_SECRETS_MANAGER:false}
jwt.secret.name=${JWT_SECRET_NAME:mirror-user-service/jwt-secret}
jwt.secret.region=${JWT_SECRET_REGION:ap-southeast-1}
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:3600}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400}

# Security Configuration
security.max-failed-attempts=${MAX_FAILED_ATTEMPTS:5}
security.account-lock-duration=${ACCOUNT_LOCK_DURATION:300}

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Rate Limiting Configuration
rate.limit.enabled=${RATE_LIMIT_ENABLED:false}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000, http://localhost:5173, http://localhost:5174, http://localhost:8080, https://*.ngrok-free.app, https://*.ngrok.io, https://test-6zwslg7sp-quoctis-projects.vercel.app}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# AWS S3 Configuration
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.region.static=${AWS_REGION:ap-southeast-1}
cloud.aws.stack.auto=false

# Cloudflare R2 Configuration (S3-compatible)
# Set cloudflare.r2.enabled=true to enable R2 endpoints
cloudflare.r2.enabled=${CLOUDFLARE_R2_ENABLED:false}
cloudflare.r2.account-id=${CLOUDFLARE_R2_ACCOUNT_ID:}
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY:}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY:}
cloudflare.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME:}
cloudflare.r2.public-url-base=${CLOUDFLARE_R2_PUBLIC_URL_BASE:}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
# Disable mail health check (Gmail SMTP doesn't support it)
management.health.mail.enabled=false

# Logging Configuration
logging.level.com.mirror.product=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.cors=WARN
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.jdbc.datasource=WARN
logging.level.com.zaxxer.hikari=WARN

# Server Configuration
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Spring Security
spring.security.headers.frame=deny
spring.security.headers.content-type=nosniff

# CORS (backup config)
spring.web.cors.allowed-origins=https://test-6zwslg7sp-quoctis-projects.vercel.app, http://localhost:3000, http://localhost:5173, http://localhost:5174

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Currency API Configuration (FREE exchangerate-api.com)
currency.api.url=https://api.exchangerate-api.com/v4/latest

# Precious Metal Price API Configuration (FREE APIs)
# ================================================
# Primary: gold-api.com (FREE, no auth, unlimited requests)
#   - API URL: https://api.gold-api.com/price/XAU
#   - No API key required
#
# Fallback: metals.dev (FREE 100 requests/month)
#   - Sign up at https://metals.dev/ for API key
#   - API URL: https://api.metals.dev/v1/latest
#
# Set precious.metal.use-mock-data=false for production
precious.metal.use-mock-data=${PRECIOUS_METAL_USE_MOCK_DATA:false}
metals.dev.api.key=${METALS_DEV_API_KEY:}

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=exchangeRates,allExchangeRates,metalPrices

# Rate Limiting Configuration for R2 Upload
# Max uploads per IP within the time window
rate.limit.upload.max-requests=${RATE_LIMIT_UPLOAD_MAX:20}
# Time window in seconds (default: 1 hour)
rate.limit.upload.window-seconds=${RATE_LIMIT_UPLOAD_WINDOW:3600}

# ==========================================
# NOTIFICATION SERVICE CONFIGURATION
# (Migrated from notification-service)
# ==========================================

# Notification Mode: local (default), rest (external service), or noop (disabled)
notification.service.mode=${NOTIFICATION_MODE:local}

# Email/SMTP Configuration
# Note: smtp-relay.gmail.com requires IP whitelist in Google Workspace
# For local dev, use smtp.gmail.com with app password
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.from=info@mirrorfuturediamond.com

# Notification defaults
app.notification.default-sender=${NOTIFICATION_DEFAULT_SENDER:info@mirrorfuturediamond.com}
app.notification.default-sender-name=${NOTIFICATION_DEFAULT_SENDER_NAME:MIRROR FUTURE DIAMOND}

# Template mapping (event type -> template name)
app.notification.templates.ids.order.created=mail/order-created
app.notification.templates.ids.order.status.changed=mail/order-status-changed
app.notification.templates.ids.payment.due=mail/payment-due
app.notification.templates.ids.submission.thank.you=mail/submission-thank-you
app.notification.templates.ids.user.email.verification=mail/email-verification
app.notification.templates.ids.user.password.reset=mail/password-reset
app.notification.templates.ids.appointment-confirmation=mail/appointment-confirmation

# Turnstile (anti-spam) Configuration
app.security.turnstile.enabled=${TURNSTILE_ENABLED:true}
app.security.turnstile.secret=${TURNSTILE_SECRET:}

# ==========================================
# MISA eShop API CONFIGURATION
# ==========================================
misa.api.domain=${MISA_DOMAIN:mirrorfuturediamond.mshopkeeper.vn}
misa.api.app-id=${MISA_APP_ID:MShopKeeperOpenPlatform}
misa.api.secret-key=${MISA_SECRET_KEY:}
misa.api.base-url=${MISA_BASE_URL:https://graphapi.mshopkeeper.vn}

# MISA Sync Configuration
misa.sync.enabled=${MISA_SYNC_ENABLED:true}
misa.sync.batch-size=${MISA_SYNC_BATCH_SIZE:100}
misa.sync.retry-attempts=${MISA_SYNC_RETRY_ATTEMPTS:3}
misa.sync.retry-delay=${MISA_SYNC_RETRY_DELAY:5000}

# MISA Sync Scheduler (Cron expressions)
mirror.sync.inventory.cron=${MISA_SYNC_INVENTORY_CRON:0 0/5 * * * ?}
mirror.sync.categories.cron=${MISA_SYNC_CATEGORIES_CRON:0 0 3 * * SUN}
mirror.sync.customers.cron=${MISA_SYNC_CUSTOMERS_CRON:0 0 3 * * ?}
mirror.sync.invoices.cron=${MISA_SYNC_INVOICES_CRON:0 0 4 * * ?}
mirror.sync.warehouses.cron=${MISA_SYNC_WAREHOUSES_CRON:0 0 0/6 * * ?}
mirror.sync.full.cron=${MISA_SYNC_FULL_CRON:0 0 1 1 * ?}

# MISA Order Integration (Polling & Retry)
mirror.sync.order-polling.cron=${MISA_ORDER_POLLING_CRON:0 0/5 * * * ?}
mirror.sync.order-retry.cron=${MISA_ORDER_RETRY_CRON:0 0/30 * * * ?}

# MISA Inventory Balance Polling (every 5 minutes)
mirror.sync.inventory-balance.cron=${MISA_SYNC_INVENTORY_BALANCE_CRON:0 0/5 * * * ?}

# ==========================================
# MISA AMIS ACT API CONFIGURATION
# ==========================================
misa.amis.app-id=${MISA_AMIS_APP_ID:}
misa.amis.access-code=${MISA_AMIS_ACCESS_CODE:}
misa.amis.base-url=${MISA_AMIS_BASE_URL:https://actapp.misa.vn}
misa.amis.org-company-code=${MISA_AMIS_ORG_COMPANY_CODE:mirror}
misa.amis.callback-url=${MISA_AMIS_CALLBACK_URL:}
misa.amis.branch-id=${MISA_AMIS_BRANCH_ID:bb8f0d92-84a7-4715-b27e-ccf8f6e270d5}

# ==========================================
# USER SERVICE CONFIGURATION
# (Migrated from user-service)
# ==========================================

# Rate Limiting Configuration (user auth)
rate.limit.auth.enabled=${RATE_LIMIT_AUTH_ENABLED:false}

# Email Verification Configuration
app.email-verification.token-expiration=${EMAIL_VERIFICATION_TOKEN_EXPIRATION:86400}
app.email-verification.enabled=${EMAIL_VERIFICATION_ENABLED:true}

# Password Reset OTP Configuration
app.password-reset.otp-expiration=${PASSWORD_RESET_OTP_EXPIRATION:300}
app.password-reset.otp-length=${PASSWORD_RESET_OTP_LENGTH:6}
app.password-reset.max-attempts=${PASSWORD_RESET_MAX_ATTEMPTS:3}
app.password-reset.request-cooldown=${PASSWORD_RESET_REQUEST_COOLDOWN:60}
app.password-reset.reset-token-expiration=${PASSWORD_RESET_TOKEN_EXPIRATION:900}

# Frontend Configuration (for email verification links)
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.frontend.verification-path=${VERIFICATION_PATH:/verify-email}
app.frontend.reset-password-path=${RESET_PASSWORD_PATH:/reset-password}

# POD QR Code & Scan Configuration
pod.qr.base-url=${POD_QR_BASE_URL:http://localhost:8082/q/}
pod.frontend.base-url=${POD_FRONTEND_BASE_URL:http://localhost:5173}
pod.frontend.product-path=${POD_FRONTEND_PRODUCT_PATH:/f4g5h6i7-j8k9-0l1m-2n3o-4p5q6r7s8t9u/}
pod.frontend.error-path=${POD_FRONTEND_ERROR_PATH:/qr-error}
pod.attribution.window-days=${POD_ATTRIBUTION_WINDOW_DAYS:30}
pod.scan.dedup-minutes=${POD_SCAN_DEDUP_MINUTES:5}
pod.cookie.secure=${POD_COOKIE_SECURE:false}
