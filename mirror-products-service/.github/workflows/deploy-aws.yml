name: Deploy to AWS App Runner

on:
  push:
    branches: [ main, master, dev/nam]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: mirror-product-service
  SERVICE_ARN: arn:aws:apprunner:ap-southeast-1:081039669202:service/mirror-product-service/bc695a2933d54d29a2e8a5d2661268ea

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    steps:
    # Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # Setup Java
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # Build JAR
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # Clear any existing AWS credentials
    - name: Clear AWS credentials
      run: |
        unset AWS_ACCESS_KEY_ID
        unset AWS_SECRET_ACCESS_KEY
        unset AWS_SESSION_TOKEN
        rm -rf ~/.aws/

    # Configure AWS credentials
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # Login to Amazon ECR using GitHub Secrets
    - name: Login to Amazon ECR
      id: login-ecr
      run: |
        # Get ECR login token using configured AWS credentials
        ECR_TOKEN=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
        echo "$ECR_TOKEN" | docker login --username AWS --password-stdin 081039669202.dkr.ecr.ap-southeast-1.amazonaws.com
        
        # Set registry output
        echo "registry=081039669202.dkr.ecr.ap-southeast-1.amazonaws.com" >> $GITHUB_OUTPUT

    # Build and push Docker image
    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    # Deploy to App Runner
    - name: Deploy to App Runner
      run: |
        aws apprunner start-deployment \
          --service-arn ${{ env.SERVICE_ARN }} \
          --region ${{ env.AWS_REGION }}

    # Wait for deployment to complete
    - name: Wait for deployment
      run: |
        echo "Waiting for deployment to complete..."
        for i in {1..20}; do
          STATUS=$(aws apprunner describe-service \
            --service-arn ${{ env.SERVICE_ARN }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Service.Status' \
            --output text)
          
          echo "Status: $STATUS"
          
          if [ "$STATUS" = "RUNNING" ]; then
            echo "✅ Deployment completed successfully!"
            exit 0
          fi
          
          if [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "UPDATE_FAILED" ]; then
            echo "❌ Deployment failed!"
            exit 1
          fi
          
          sleep 30
        done
        echo "⏱️ Deployment timeout!"
        exit 1