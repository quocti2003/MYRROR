name: Trigger K6 Performance Test

# Khi push code len branch full-local thi tu dong trigger Repo B chay k6 test
on:
  push:
    branches: [full-local]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      # Buoc 1: Gui trigger sang Repo B
      - name: Trigger K6 test in Repo B
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            https://api.github.com/repos/quocti2003/k6-automated-performance-test/dispatches \
            -d '{"event_type": "run-k6-test", "client_payload": {"ref": "${{ github.sha }}"}}'
          echo "Trigger sent. Waiting 10s for workflow to start..."
          sleep 10

      # Buoc 2: Cho Repo B chay xong va lay ket qua
      - name: Wait for Repo B workflow result
        run: |
          echo "Polling Repo B workflow status..."
          for i in $(seq 1 120); do
            # Lay workflow run moi nhat cua Repo B (event = repository_dispatch)
            RUN=$(curl -s \
              -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
              "https://api.github.com/repos/quocti2003/k6-automated-performance-test/actions/runs?event=repository_dispatch&per_page=1")

            STATUS=$(echo "$RUN" | jq -r '.workflow_runs[0].status')
            CONCLUSION=$(echo "$RUN" | jq -r '.workflow_runs[0].conclusion')
            RUN_URL=$(echo "$RUN" | jq -r '.workflow_runs[0].html_url')

            echo "Attempt $i/120 - Status: $STATUS, Conclusion: $CONCLUSION"

            if [ "$STATUS" = "completed" ]; then
              echo ""
              echo "Repo B workflow completed!"
              echo "Result: $CONCLUSION"
              echo "URL: $RUN_URL"

              if [ "$CONCLUSION" = "success" ]; then
                echo "K6 performance test PASSED!"
                exit 0
              else
                echo "K6 performance test FAILED!"
                exit 1
              fi
            fi

            sleep 15
          done

          echo "Timeout: Repo B workflow did not complete in 30 minutes"
          exit 1
